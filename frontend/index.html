<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StockPilot</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#edf2ff;font-family:Inter,Arial}.wrap{max-width:1150px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between}.logo{font-size:30px;font-weight:900}.muted{color:#8490a8}
.card{background:#101827;border:1px solid #202d47;border-radius:18px;padding:20px;margin-top:18px}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button,.btn{border:0;border-radius:10px;padding:11px 16px;background:#725cff;color:white;font-weight:800;cursor:pointer}.tabs button.secondary{background:#172137}.search{display:flex;gap:10px}.search input,input{flex:1;padding:13px;background:#111a2b;color:white;border:1px solid #293651;border-radius:10px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.price{font-size:42px;font-weight:900}.pill{display:inline-block;padding:7px 12px;border-radius:20px;background:#1d3a2c;color:#70e0a0;font-weight:800}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#151f31;padding:12px;border-radius:10px}.label{font-size:11px;color:#8490a8}.val{font-size:18px;font-weight:800;margin-top:4px}canvas{width:100%;height:300px;margin-top:10px}
.list{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 12px;background:#182238;border-radius:999px;cursor:pointer}.danger{background:#4a2330}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #202d47}.auth{max-width:430px;margin:50px auto}.auth input{display:block;width:100%;margin:8px 0}.msg{margin:10px 0;color:#9aa7c1}
@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:16px}.top{gap:8px;flex-direction:column}}
</style></head><body><div class="wrap">
<div id="auth" class="auth card"><div class="logo">StockPilot</div><p class="muted">Sign in to use your watchlist and portfolio.</p><input id="u" placeholder="Username"><input id="pw" type="password" placeholder="Password"><div style="display:flex;gap:8px"><button class="btn" onclick="login()">Login</button><button class="btn" onclick="register()">Create account</button></div><div id="am" class="msg"></div></div>
<div id="app" class="hidden"><div class="top"><div><div class="logo">StockPilot</div><div class="muted">ML stock analysis dashboard</div></div><button class="btn" onclick="logout()">Log out</button></div>
<div class="tabs"><button onclick="show('analysis')">Analysis</button><button class="secondary" onclick="show('watch')">Watchlist</button><button class="secondary" onclick="show('portfolio')">Portfolio</button></div>
<section id="analysis"><div class="card search"><input id="ticker" value="IBM" placeholder="AAPL, MSFT, NVDA..."><button class="btn" onclick="analyze()">Analyze</button></div><div id="msg" class="msg"></div><div class="grid"><div class="card"><div id="tn" class="muted">—</div><div id="price" class="price">—</div><span id="dir" class="pill">—</span><canvas id="chart" width="900" height="300"></canvas></div><div class="card"><h2>Forecast</h2><div class="metrics"><div class="metric"><div class="label">Model</div><div id="model" class="val">—</div></div><div class="metric"><div class="label">Return</div><div id="ret" class="val">—</div></div><div class="metric"><div class="label">Target</div><div id="target" class="val">—</div></div><div class="metric"><div class="label">Range</div><div id="range" class="val">—</div></div><div class="metric"><div class="label">Confidence</div><div id="conf" class="val">—</div></div><div class="metric"><div class="label">Validation RMSE</div><div id="rmse" class="val">—</div></div></div><br><button class="btn" onclick="addWatch()">Add to watchlist</button></div></div></section>
<section id="watch" class="hidden"><div class="card"><h2>Watchlist</h2><div id="watchlist" class="list"></div></div></section>
<section id="portfolio" class="hidden"><div class="card"><h2>Portfolio</h2><div class="row"><b>Ticker</b><b>Shares</b><b>Avg price</b><span></span></div><div id="plist"></div><hr><div class="search"><input id="pt" placeholder="Ticker"><input id="ps" type="number" placeholder="Shares"><input id="pa" type="number" placeholder="Average price"><button class="btn" onclick="saveHolding()">Save</button></div></div></section>
</div></div>
<script>\n// For deployment, set window.STOCKPILOT_API before this script if the API is hosted separately.\n
let token=localStorage.getItem('sp_token');
function api(path,opt={}){opt.headers=Object.assign({'Content-Type':'application/json','Authorization':token||''},opt.headers||{});return fetch('http://127.0.0.1:8000'+path,opt)}
function enter(){document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadWatch();loadPortfolio()}
async function login(){let r=await api('/api/login',{method:'POST',body:JSON.stringify({username:u.value,password:pw.value})});let d=await r.json();if(!r.ok)return am.textContent=d.detail;token=d.token;localStorage.setItem('sp_token',token);enter()}
async function register(){let r=await api('/api/register',{method:'POST',body:JSON.stringify({username:u.value,password:pw.value})});let d=await r.json();am.textContent=r.ok?'Account created — now log in.':d.detail}
function logout(){localStorage.removeItem('sp_token');location.reload()}
function show(id){['analysis','watch','portfolio'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));if(id==='watch')loadWatch();if(id==='portfolio')loadPortfolio()}
async function analyze(){let s=ticker.value.trim().toUpperCase();msg.textContent='Loading market data and running model…';let r=await api('/api/stock/'+encodeURIComponent(s));let d=await r.json();if(!r.ok)return msg.textContent=d.detail;let p=d.forecast;tn.textContent=d.ticker+' · '+d.updated;price.textContent='$'+d.price.toFixed(2);dir.textContent=p.direction;model.textContent=p.model;ret.textContent=p.return_pct+'%';target.textContent='$'+p.target;range.textContent='$'+p.low+' – $'+p.high;conf.textContent=p.confidence+'%';rmse.textContent=p.rmse;msg.textContent='';draw(d.history)}
function draw(h){let c=chart,x=c.getContext('2d'),v=h.map(a=>a.price),mn=Math.min(...v),mx=Math.max(...v);x.clearRect(0,0,c.width,c.height);x.beginPath();v.forEach((p,i)=>{let X=12+i*(c.width-24)/(v.length-1),Y=c.height-20-(p-mn)/(mx-mn||1)*(c.height-40);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.strokeStyle='#8b7cff';x.lineWidth=3;x.stroke()}
async function addWatch(){let s=ticker.value.trim().toUpperCase();await api('/api/watchlist/'+s,{method:'POST'});loadWatch()}
async function loadWatch(){let r=await api('/api/watchlist');if(!r.ok)return;let a=await r.json();watchlist.innerHTML=a.map(x=>`<span class="chip" onclick="ticker.value='${x}';show('analysis');analyze()">${x} ✕</span>`).join('')||'<span class="muted">No stocks yet.</span>'}
async function loadPortfolio(){let r=await api('/api/portfolio');if(!r.ok)return;let a=await r.json();plist.innerHTML=a.map(x=>`<div class="row"><span>${x.ticker}</span><span>${x.shares}</span><span>$${x.avg_price}</span><button class="btn danger" onclick="delHolding('${x.ticker}')">Delete</button></div>`).join('')||'<p class="muted">No holdings yet.</p>'}
async function saveHolding(){await api('/api/portfolio',{method:'POST',body:JSON.stringify({ticker:pt.value,shares:+ps.value,avg_price:+pa.value})});loadPortfolio()}
async function delHolding(t){await api('/api/portfolio/'+t,{method:'DELETE'});loadPortfolio()}
if(token)enter();
</script></body></html>
